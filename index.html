<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>美肌テスト（試作1）</title>
<style>
:root{--bg:#ffffff;--fg:#1a1a1a;--card:#f1f1f4;--accent:#2563eb;--mut:#5f6368;--ok:#15803d;--ng:#b91c1c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--fg:#f2f2f2;--card:#202024;--accent:#6ea0ff;--mut:#a0a4aa;--ok:#4ade80;--ng:#f87171}}
:root[data-theme="dark"]{--bg:#121214;--fg:#f2f2f2;--card:#202024;--accent:#6ea0ff;--mut:#a0a4aa;--ok:#4ade80;--ng:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding:12px 14px 28px;max-width:640px;margin-inline:auto}
h1{font-size:20px;margin:6px 0 4px}
p.lead{margin:0 0 12px;color:var(--mut);font-size:14px}
.stage{background:#000;border-radius:12px;overflow:hidden;position:relative;min-height:160px}
canvas{display:block;width:100%;height:auto}
.card{background:var(--card);border-radius:12px;padding:12px 14px;margin-top:12px}
button{font:inherit;border:0;border-radius:10px;padding:12px 16px;background:var(--accent);color:#fff;font-weight:600;width:100%}
button.sub{background:transparent;color:var(--accent);border:1px solid var(--accent);margin-top:8px}
label{display:block;margin-top:10px;font-weight:600}
input[type=range]{width:100%}
.row{display:flex;justify-content:space-between;color:var(--mut);font-size:13px}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-weight:600}
.chk input{width:22px;height:22px}
#msg{margin-top:10px;font-size:14px;color:var(--ng);white-space:pre-wrap}
.st div{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
.ok{color:var(--ok);font-weight:700}.ng{color:var(--ng);font-weight:700}
</style>
</head>
<body>
<h1>美肌テスト（試作1）</h1>
<p class="lead">iPhoneのブラウザだけで、リアルタイムの美肌が動くかを確かめるページです。映像は端末の外へ送られません。</p>

<div class="card" id="frameBox" hidden>
<div><b>いま、Claudeの枠の中で開いています。</b>この状態では、カメラが使えない場合があります。</div>
<button id="openTop" class="sub">別のタブで開く</button>
<div class="row" id="urlTxt" style="margin-top:8px;word-break:break-all"></div>
<button id="copyUrl" class="sub">URLをコピーして、Safariに貼り付ける</button>
</div>

<div class="stage"><canvas id="cv" width="640" height="360"></canvas></div>

<div class="card">
<button id="start">カメラを開始する</button>
<button id="flip" class="sub" disabled>カメラ切り替え（前／後ろ）</button>
<div id="msg"></div>
</div>

<div class="card">
<label for="sm">美肌の強さ <span id="smv">60</span></label>
<input id="sm" type="range" min="0" max="100" value="60">
<label for="br">明るさ <span id="brv">5</span></label>
<input id="br" type="range" min="0" max="30" value="5">
<label class="chk"><input id="cmp" type="checkbox"> 左半分を元の映像にして比べる</label>
</div>

<div class="card st">
<div><span>画面の大きさ</span><span id="s-res">-</span></div>
<div><span>1秒あたりの枚数（目標30）</span><span id="s-fps">-</span></div>
<div><span>配信に使う変換（captureStream）</span><span id="s-cap">-</span></div>
</div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};
var cv=$("cv"),msg=$("msg"),startBtn=$("start"),flipBtn=$("flip");
var video=document.createElement("video");
video.setAttribute("playsinline","");video.muted=true;
var gl=null,prog=null,tex=null,U={},stream=null,running=false,facing="user",curW=0,curH=0;
var frames=0,lastT=performance.now();

var VS="attribute vec2 aPos;varying vec2 vUv;varying vec2 vScr;uniform float uMirror;"+
"void main(){vec2 t=vec2(aPos.x*0.5+0.5,0.5-aPos.y*0.5);vScr=t;"+
"vUv=vec2(uMirror>0.5?1.0-t.x:t.x,t.y);gl_Position=vec4(aPos,0.0,1.0);}";

var FS="#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif\n"+
"varying vec2 vUv;varying vec2 vScr;uniform sampler2D uTex;uniform vec2 uTexel;uniform float uScale;"+
"uniform float uSmooth;uniform float uBright;uniform float uCompare;\n"+
"float skin(vec3 c){float cb=-0.169*c.r-0.331*c.g+0.5*c.b+0.5;float cr=0.5*c.r-0.419*c.g-0.081*c.b+0.5;"+
"return smoothstep(0.28,0.31,cb)*(1.0-smoothstep(0.49,0.52,cb))*smoothstep(0.50,0.53,cr)*(1.0-smoothstep(0.67,0.70,cr));}\n"+
"void main(){vec3 c0=texture2D(uTex,vUv).rgb;vec3 sum=c0;float ws=1.0;"+
"for(int r=0;r<2;r++){float rad=(2.0+2.5*float(r))*uScale;"+
"for(int i=0;i<8;i++){float a=float(i)*0.7853982;vec2 o=vec2(cos(a),sin(a))*rad*uTexel;"+
"vec3 c=texture2D(uTex,vUv+o).rgb;vec3 d=c-c0;float w=exp(-dot(d,d)*40.0);sum+=c*w;ws+=w;}}"+
"vec3 sm=sum/ws;float m=skin(sm);vec3 o=mix(c0,sm,m*uSmooth);o+=uBright*(0.4+0.6*m);"+
"if(uCompare>0.5&&vScr.x<0.5){o=c0;}gl_FragColor=vec4(clamp(o,0.0,1.0),1.0);}";

function say(t){msg.textContent=t||"";}

function compile(type,src){
var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){throw new Error("シェーダーのエラー: "+gl.getShaderInfoLog(s));}
return s;}

function initGL(){
if(gl){return;}
gl=cv.getContext("webgl",{premultipliedAlpha:false})||cv.getContext("experimental-webgl");
if(!gl){throw new Error("このブラウザはWebGLに対応していません。");}
prog=gl.createProgram();
gl.attachShader(prog,compile(gl.VERTEX_SHADER,VS));
gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){throw new Error("リンクのエラー: "+gl.getProgramInfoLog(prog));}
gl.useProgram(prog);
var buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
var loc=gl.getAttribLocation(prog,"aPos");gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
["uTex","uTexel","uScale","uSmooth","uBright","uCompare","uMirror"].forEach(function(n){U[n]=gl.getUniformLocation(prog,n);});
}

function checkCapture(){
var el=$("s-cap");
try{
if(typeof cv.captureStream!=="function"){el.textContent="未対応";el.className="ng";return;}
var cs=cv.captureStream(30);var n=cs.getVideoTracks().length;
el.textContent=n>0?"使える":"映像なし";el.className=n>0?"ok":"ng";
}catch(e){el.textContent="エラー";el.className="ng";}
}

function loop(){
if(!running){return;}
if(video.readyState>=2&&video.videoWidth>0){
var w=video.videoWidth,h=video.videoHeight;
if(w!==curW||h!==curH){
curW=w;curH=h;cv.width=w;cv.height=h;gl.viewport(0,0,w,h);
$("s-res").textContent=w+" × "+h;
}
gl.bindTexture(gl.TEXTURE_2D,tex);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);
gl.uniform1i(U.uTex,0);
gl.uniform2f(U.uTexel,1.0/w,1.0/h);
gl.uniform1f(U.uScale,Math.max(1.0,w/640.0));
gl.uniform1f(U.uSmooth,parseFloat($("sm").value)/100.0);
gl.uniform1f(U.uBright,parseFloat($("br").value)/100.0);
gl.uniform1f(U.uCompare,$("cmp").checked?1.0:0.0);
gl.uniform1f(U.uMirror,facing==="user"?1.0:0.0);
gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
frames++;
var t=performance.now();
if(t-lastT>=1000){$("s-fps").textContent=(frames*1000/(t-lastT)).toFixed(1);frames=0;lastT=t;}
}
requestAnimationFrame(loop);
}

function stopStream(){
running=false;
if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;}
}

async function begin(){
say("");
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
say("このページではカメラを使えません。https（鍵マークのあるアドレス）で開いてください。");return;}
try{
initGL();
stopStream();
stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false});
video.srcObject=stream;
await video.play();
curW=0;curH=0;running=true;frames=0;lastT=performance.now();
startBtn.textContent="カメラを再開始する";flipBtn.disabled=false;
checkCapture();
loop();
}catch(e){
var n=e&&e.name?e.name:"";
if(n==="NotAllowedError"){say("カメラが許可されていません。\niPhoneの「設定」→「Safari」→「カメラ」で許可してください。");}
else if(n==="NotFoundError"){say("カメラが見つかりません。");}
else{say("エラー: "+(e&&e.message?e.message:e));}
}
}

var framed=false;try{framed=(window.top!==window.self);}catch(e){framed=true;}
if(framed){
$("frameBox").hidden=false;
$("urlTxt").textContent=/^(about|blob|data):/.test(location.href)?"このページには単独のURLがありません（"+location.href+"）":location.href;
}
$("openTop").addEventListener("click",function(){
var w=null;try{w=window.open(location.href,"_blank");}catch(e){w=null;}
if(!w){say("別タブを開けませんでした。下のURLをコピーして、Safariに貼り付けてください。");}
});
$("copyUrl").addEventListener("click",function(){
var ng=function(){say("コピーできませんでした。上のURLを長押ししてコピーしてください。");};
try{navigator.clipboard.writeText(location.href).then(function(){say("コピーしました。Safariのアドレス欄に貼り付けて開いてください。");},ng);}catch(e){ng();}
});
startBtn.addEventListener("click",begin);
flipBtn.addEventListener("click",function(){facing=(facing==="user")?"environment":"user";begin();});
$("sm").addEventListener("input",function(){$("smv").textContent=$("sm").value;});
$("br").addEventListener("input",function(){$("brv").textContent=$("br").value;});
})();
</script>
</body>
</html>
